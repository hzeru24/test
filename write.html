<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write Entry - Public Journal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="write">

<div class="editor-shell">
  <header class="editor-toolbar">
    <a class="back-link" href="index.html">← PUBLIC JOURNAL</a>

    <div class="toolbar-group">
      <button type="button" data-command="bold"><b>B</b></button>
      <button type="button" data-command="italic"><i>I</i></button>
      <button type="button" data-command="underline"><u>U</u></button>
      <button type="button" data-command="justifyLeft">L</button>
      <button type="button" data-command="justifyCenter">C</button>
      <button type="button" data-command="justifyRight">R</button>
    </div>

    <label class="title-field">
      <span>TITLE:</span>
      <input id="title" type="text" maxlength="120" placeholder="Give your entry a title">
    </label>

    <button id="post-button" class="post-button" type="button">POST ENTRY</button>
  </header>

  <main class="paper-wrap">
    <div
      id="editor"
      class="paper"
      contenteditable="true"
      role="textbox"
      aria-multiline="true"
      data-placeholder="Write your journal here..."
    ></div>

    <div class="editor-footer">
      <span>Posted publicly as <strong>Anonymous</strong></span>
      <span id="counter">0 / 20000</span>
    </div>
  </main>

  <p id="write-status" class="write-status" aria-live="polite"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.3.0/dist/purify.min.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
